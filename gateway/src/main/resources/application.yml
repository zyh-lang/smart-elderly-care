server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: user-center
          uri: lb://user-center
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=2
        - id: order-work
          uri: lb://order-work
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=2
        - id: health-record
          uri: lb://health-record
          predicates:
            - Path=/api/health/**
          filters:
            - StripPrefix=2
        - id: notify
          uri: lb://notify
          predicates:
            - Path=/api/notify/**
          filters:
            - StripPrefix=2
        - id: statistics
          uri: lb://statistics
          predicates:
            - Path=/api/statistics/**
          filters:
            - StripPrefix=2
